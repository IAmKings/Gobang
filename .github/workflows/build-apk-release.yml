name: Build APK & Release

# 触发方式：
#   1) 推送 tag（推荐，用于发版）：
#        git tag v1.0.0 && git push origin v1.0.0
#      构建 app-debug.apk（可安装），自动创建/更新 GitHub Release（Gobang <版本>）并附加 APK。
#   2) workflow_dispatch（手动）：仅构建并上传 Actions artifact（不发 Release），
#      可用 inputs.version_name 指定版本名（默认 1.0.0）。
#
# 说明：项目未配置 release 签名 keystore，故发布可安装的 debug 签名 APK；
#       如需正式签名发布，请配置 secrets（KEYSTORE_BASE64 等）并在此文件加 release 变体构建步骤。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名（默认取 tag，如 v1.2.3 → 1.2.3；手动触发时可用）'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version name
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"           # tag: v1.2.3 -> 1.2.3
          VER="${{ inputs.version_name }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${TAG}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "ref_type=${GITHUB_REF_TYPE}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PversionName=${{ steps.ver.outputs.version }} --no-daemon

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/gobang-${{ steps.ver.outputs.version }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gobang-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: Gobang ${{ steps.ver.outputs.version }}
          body: |
            ## Gobang ${{ steps.ver.outputs.version }}

            Android APK（debug 签名，可直接侧载/`adb install`）：

            - 文件：`gobang-${{ steps.ver.outputs.version }}-debug.apk`
            - 构建 commit：`${{ github.sha }}`
            - 说明：本项目未配置 release keystore，此 APK 为 debug 签名（自用/体验）；
              正式发布请配置签名 secrets 后使用 release 变体。
